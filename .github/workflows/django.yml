
name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          WEB_DOMAIN: localhost,127.0.0.1
        run: python manage.py check

      - name: Run automated tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          WEB_DOMAIN: localhost,127.0.0.1
        run: python manage.py test accounts api --verbosity 2

      - name: Build Docker image
        run: |
          docker build -t instagram-clone:ci .

      - name: Trivy vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: instagram-clone:ci
          format: json
          output: trivy-report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Display HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: instagram-clone:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload Trivy security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 14
